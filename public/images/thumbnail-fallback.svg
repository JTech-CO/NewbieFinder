<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-hidden="true" focusable="false">
  <!--
    썸네일 로드 실패 시 쓰는 대체 이미지. (백서 8.5)
    16:9, 검정 배경 + 중앙의 작은 형광 초록 레이더 마크.
    카드의 주인공은 방송 제목이므로 이 표식은 눈에 띄지 않아야 한다.
    텍스트와 외부 리소스는 넣지 않는다.
  -->
  <rect width="480" height="270" fill="#0A0A0A"/>
  <g opacity="0.45">
    <circle cx="240" cy="135" r="5.5" fill="#00FFA3"/>
    <g fill="none" stroke="#00FFA3" stroke-width="4.5" stroke-linecap="round">
      <path d="M239.4 153 A18 18 0 1 1 255.3 144.5"/>
      <path d="M238.9 167 A32 32 0 1 1 267.1 152"/>
    </g>
  </g>
</svg>
